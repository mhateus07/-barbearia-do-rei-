name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barbearia-rei-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: barbearia-rei-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: npm audit (informativo — não bloqueia o merge)
        run: npm audit --audit-level=high
        continue-on-error: true

  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barbearia-rei-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: barbearia-rei-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: npm audit (informativo — não bloqueia o merge)
        run: npm audit --audit-level=high
        continue-on-error: true
